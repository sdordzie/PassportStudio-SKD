name: SAM Android APK Build
on:
  push:
    branches: [main]
    paths:
      - 'SAMMessageScheduler/**'
      - '.github/workflows/build-sam-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Accept licences and install SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent signing key
        shell: bash
        env:
          SAM_KEYSTORE_BASE64: ${{ secrets.SAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SAM_KEYSTORE_BASE64" ]; then
            echo "$SAM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sam-release.jks"
            echo "SAM_KEYSTORE_PATH=$RUNNER_TEMP/sam-release.jks" >> "$GITHUB_ENV"
            echo "Permanent SAM signing key loaded: updates will install over earlier signed builds."
          else
            echo "::warning::SAM_KEYSTORE_BASE64 secret is not set. This APK uses a temporary key and will NOT install over an existing SAM app."
          fi
      - name: Assemble signed APK
        env:
          SAM_KEYSTORE_PASSWORD: ${{ secrets.SAM_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon -p SAMMessageScheduler :app:assembleRelease
      - name: Name APK by version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' SAMMessageScheduler/app/build.gradle.kts)
          mkdir -p dist
          cp SAMMessageScheduler/app/build/outputs/apk/release/app-release.apk "dist/SAM-Message-Scheduler-${VERSION}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM-Message-Scheduler-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

# Build SAM Message Scheduler APK on main updates.
# Rebuild requested after Contact Centre 6.13.0 merge.

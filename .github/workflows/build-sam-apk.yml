name: SAM Android APK Build
on:
  push:
    branches: [main]
    paths:
      - 'SAMMessageScheduler/**'
      - '.github/workflows/build-sam-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Accept licences and install SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        run: gradle --no-daemon -p SAMMessageScheduler :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM-Message-Scheduler-APK
          path: SAMMessageScheduler/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

# Trigger APK rebuild after the Kotlin parser correction.

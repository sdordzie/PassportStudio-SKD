name: PassportPro Studio Android APK

on:
  push:
    paths:
      - "AndroidNative/**"
      - ".github/workflows/passportpro-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.PASSPORTPRO_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.PASSPORTPRO_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.PASSPORTPRO_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.PASSPORTPRO_KEYSTORE_BASE64 }}
      KEYSTORE_FILE: passportpro-release.jks
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets and install keystore
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing PASSPORTPRO_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing PASSPORTPRO_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PASSPORTPRO_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PASSPORTPRO_KEY_PASSWORD repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform and Build Tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        working-directory: AndroidNative
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportProStudio-signed-release-apk
          path: AndroidNative/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

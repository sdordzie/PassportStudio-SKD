name: PassportPro Studio Android APK

on:
  push:
    paths:
      - "AndroidNative/**"
      - ".github/workflows/passportpro-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PASSPORTPRO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK Platform and Build Tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Signed release APK — installs over earlier signed versions and keeps data.
      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.PASSPORTPRO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/passportpro-release.jks"
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: AndroidNative
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/passportpro-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PASSPORTPRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PASSPORTPRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PASSPORTPRO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "PassportProStudio-$VERSION.apk"
      - name: Upload signed APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PassportProStudio-signed-apk
          path: AndroidNative/PassportProStudio-*.apk
          if-no-files-found: error
          retention-days: 30

      # Fallback while the signing secrets are not set up yet.
      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: AndroidNative
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PassportProStudio-debug-apk
          path: AndroidNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

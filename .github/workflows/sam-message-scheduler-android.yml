name: Build SAM Message Scheduler APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'SAMMessageScheduler/**'
      - '.github/workflows/sam-message-scheduler-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: --no-daemon -p SAMMessageScheduler :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM-Message-Scheduler-debug-APK
          path: SAMMessageScheduler/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30